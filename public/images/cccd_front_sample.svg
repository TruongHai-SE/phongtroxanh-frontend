<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="50%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#ebfbee"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Thân thẻ -->
  <rect x="2" y="2" width="536" height="336" rx="18" fill="url(#bg)" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Hoa văn bảo mật chìm -->
  <circle cx="270" cy="170" r="110" fill="none" stroke="#059669" stroke-width="0.8" opacity="0.15" stroke-dasharray="4,4"/>
  <circle cx="270" cy="170" r="85" fill="none" stroke="#059669" stroke-width="0.8" opacity="0.15"/>
  <circle cx="270" cy="170" r="60" fill="none" stroke="#059669" stroke-width="0.8" opacity="0.15"/>

  <!-- Tiêu ngữ & Quốc hiệu -->
  <text x="270" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" letter-spacing="1">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</text>
  <text x="270" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#1f2937" text-anchor="middle">Độc lập - Tự do - Hạnh phúc</text>
  
  <line x1="210" y1="53" x2="330" y2="53" stroke="#dc2626" stroke-width="1"/>

  <text x="315" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#065f46" text-anchor="middle" letter-spacing="0.5">CĂN CƯỚC CÔNG DÂN</text>
  <text x="315" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-style="italic" fill="#047857" text-anchor="middle">Identity Card</text>

  <!-- Quốc huy tượng trưng -->
  <circle cx="58" cy="50" r="22" fill="#fef08a" stroke="#dc2626" stroke-width="2"/>
  <polygon points="58,34 62,44 72,44 64,50 67,60 58,54 49,60 52,50 44,44 54,44" fill="#dc2626"/>

  <!-- Ảnh chân dung mẫu -->
  <g transform="translate(36, 105)">
    <rect width="105" height="135" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Avatar silhouette -->
    <circle cx="52.5" cy="52" r="26" fill="#64748b"/>
    <path d="M 22 120 C 22 88, 83 88, 83 120 Z" fill="#64748b"/>
    <rect x="0" y="112" width="105" height="23" rx="0" fill="#cbd5e1" opacity="0.6"/>
    <text x="52.5" y="127" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">ẢNH CHÂN DUNG</text>
  </g>

  <!-- Chip điện tử -->
  <rect x="36" y="258" width="42" height="34" rx="5" fill="url(#chip)" stroke="#b45309" stroke-width="1.2"/>
  <rect x="42" y="264" width="12" height="22" rx="2" fill="none" stroke="#78350f" stroke-width="0.8"/>
  <rect x="60" y="264" width="12" height="22" rx="2" fill="none" stroke="#78350f" stroke-width="0.8"/>

  <!-- Thông tin định danh trên thẻ -->
  <!-- Số CCCD -->
  <text x="180" y="125" font-family="sans-serif" font-size="10" fill="#64748b">Số / No.:</text>
  <text x="245" y="126" font-family="'Courier New', monospace" font-size="15" font-weight="800" fill="#b91c1c" letter-spacing="1.5">079201008888</text>

  <!-- Họ và tên -->
  <text x="180" y="152" font-family="sans-serif" font-size="10" fill="#64748b">Họ và tên / Full name:</text>
  <text x="180" y="172" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">NGUYỄN VĂN AN</text>

  <!-- Ngày sinh & Giới tính -->
  <text x="180" y="196" font-family="sans-serif" font-size="10" fill="#64748b">Ngày sinh / Date of birth:</text>
  <text x="315" y="196" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">15/08/2001</text>
  
  <text x="400" y="196" font-family="sans-serif" font-size="10" fill="#64748b">Giới tính / Sex:</text>
  <text x="475" y="196" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">Nam</text>

  <!-- Quê quán -->
  <text x="180" y="222" font-family="sans-serif" font-size="10" fill="#64748b">Quê quán / Place of origin:</text>
  <text x="180" y="238" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">Quận 1, Thành phố Hồ Chí Minh</text>

  <!-- Nơi thường trú -->
  <text x="180" y="264" font-family="sans-serif" font-size="10" fill="#64748b">Nơi thường trú / Place of residence:</text>
  <text x="180" y="280" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">Phường Bến Nghé, Quận 1, TP. Hồ Chí Minh</text>

  <!-- Giá trị đến -->
  <text x="180" y="306" font-family="sans-serif" font-size="9" fill="#64748b">Có giá trị đến / Date of expiry:</text>
  <text x="315" y="306" font-family="sans-serif" font-size="10" font-weight="600" fill="#0f172a">15/08/2041</text>

  <!-- Huy hiệu mặt trước -->
  <rect x="440" y="295" width="80" height="22" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="480" y="310" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">MẶT TRƯỚC</text>
</svg>
